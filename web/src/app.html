<!DOCTYPE html>
<html lang="en" data-theme="cambia-theme">
	<head>
		<meta charset="utf-8" />
		<title>cambia LogTools</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<meta name="darkreader-lock">
		<!--
			Applies the stored theme before first paint. This mirrors Skeleton's
			`setInitialClassState`, which used to be injected via `{@html}` from
			+layout.svelte — Svelte 5 flags that as a hydration mismatch, and a
			plain inline script here runs earlier anyway.
		-->
		<script>
			(() => {
				const classes = document.documentElement.classList;
				const prefersLight = localStorage.getItem('modeUserPrefers') === 'false';
				const noStoredPref = !('modeUserPrefers' in localStorage);
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (prefersLight || (noStoredPref && prefersDark)) {
					classes.add('dark');
				} else {
					classes.remove('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
